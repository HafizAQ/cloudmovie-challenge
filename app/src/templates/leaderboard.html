<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leaderboard</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

  <main class="container">

    <div class="card">

      <a class="back-link" href="{{ url_for('home') }}">
        ← Home
      </a>

      <h1>🏆 Leaderboard</h1>

      <p class="subtitle">
        DynamoDB integration will replace these demo scores later.
      </p>

      <form method="POST">

        <input type="text" name="player" placeholder="Player name" required>

        <input type="number" name="score" placeholder="Score" min="0" required>

        <button class="button" type="submit">
          Save Score
        </button>

      </form>

      {% if error %}

      <div class="result incorrect">
        {{ error }}
      </div>

      {% endif %}

      <table>

        <thead>

          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Score</th>
          </tr>

        </thead>

        <tbody>

          {% for score in scores %}

          <tr>

            <td>
              {{ loop.index }}
            </td>

            <td>
              {{ score.player }}
            </td>

            <td>
              {{ score.score }}
            </td>

          </tr>

          {% endfor %}

        </tbody>

      </table>

      <a class="button" href="{{ url_for('game') }}">
        Play Now
      </a>

    </div>

  </main>

</body>

</html>
