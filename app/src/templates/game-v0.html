<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Challenge</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

  <main class="container">

    <div class="card">

      <a class="back-link" href="{{ url_for('home') }}">
        ← Home
      </a>

      <h1>🎬 Guess the Movie</h1>

      {% if result %}

      <div class="result
                    {% if is_correct %}
                        correct
                    {% else %}
                        incorrect
                    {% endif %}">

        {{ result }}

      </div>

      {% endif %}

      {% if error %}

      <div class="result incorrect">
        {{ error }}
      </div>

      {% endif %}

      <div class="emoji-clue">
        {{ question.clue }}
      </div>

      <h2>
        {{ question.question }}
      </h2>

      <form method="POST">

        <input type="hidden" name="question_id" value="{{ question.id }}">

        <div class="options">

          {% for option in question.options %}

          <button class="answer-button" type="submit" name="answer" value="{{ option }}">
            {{ option }}
          </button>

          {% endfor %}

        </div>

      </form>

      <a class="leaderboard-link" href="{{ url_for('leaderboard') }}">
        View Leaderboard
      </a>

    </div>

  </main>

</body>

</html>
